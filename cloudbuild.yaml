steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/reading-tracker:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/reading-tracker:latest'

  # Run database migrations against Turso
  - name: 'node:20-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        export DATABASE_URL="$$TURSO_DATABASE_URL"
        npm ci
        npx prisma generate
        npx prisma db push --accept-data-loss
    secretEnv: ['TURSO_DATABASE_URL', 'TURSO_AUTH_TOKEN']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'reading-tracker'
      - '--image'
      - 'gcr.io/$PROJECT_ID/reading-tracker:latest'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-secrets'
      - 'TURSO_DATABASE_URL=TURSO_DATABASE_URL:latest,TURSO_AUTH_TOKEN=TURSO_AUTH_TOKEN:latest,NOTION_API_TOKEN=NOTION_API_TOKEN:latest,NOTION_DATABASE_ID=NOTION_DATABASE_ID:latest,TODOIST_API_TOKEN=TODOIST_API_TOKEN:latest,ADMIN_PASSWORD=ADMIN_PASSWORD:latest'

images:
  - 'gcr.io/$PROJECT_ID/reading-tracker:latest'

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/TURSO_DATABASE_URL/versions/latest
      env: TURSO_DATABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/TURSO_AUTH_TOKEN/versions/latest
      env: TURSO_AUTH_TOKEN
